general {
    before_sleep_cmd = nosh lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 360
    on-timeout = nosh brightness-dim
    on-resume  = nosh brightness-restore
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 630
    on-timeout = nosh lock
}

listener {
    timeout = 1800
    on-timeout = nosh suspend
}
