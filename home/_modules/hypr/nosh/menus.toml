schema = 1

[menu.apps]
title = "Applications"
placeholder = "Search applications"
hidden = true

[menu.apps.window]
namespace = "nosh-menu-apps"
anchors = ["center"]
layer = "overlay"
keyboard = "exclusive"
width = 560
height = 275

[menu.apps.view]
type = "grid"
columns = 2

[menu.apps.view.item]
layout = "row"

[menu.apps.source]
type = "builtin"
name = "apps"
search = "source"

[menu.apps.bind]
chord = "SUPER, X"

[menu.menus]
title = "Menus"
placeholder = "Search menus"
icon = "view-app-grid-symbolic"
hidden = true
show_in_apps = true

[menu.menus.window]
width = 560
height = 380

[menu.menus.view]
type = "list"

[menu.menus.source]
type = "builtin"
name = "menus"
search = "client"

[menu.menus.bind]
chord = "SUPER, M"
